[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "artemide-core"
version = "1.7.0"
description = "Independent random-initialization language-model research stack"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["torch>=2.1", "fastapi>=0.100", "uvicorn[standard]>=0.23", "pydantic>=2"]

[project.optional-dependencies]
dev = ["pytest>=7", "httpx>=0.24"]

[project.scripts]
artemide = "artemide.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["artemide*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
