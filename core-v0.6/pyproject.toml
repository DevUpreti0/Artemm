[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "artemide-core"
version = "0.7.0"
description = "Independent randomly initialized Artemide language-model research stack"
requires-python = ">=3.10"
dependencies = ["torch>=2.1", "fastapi>=0.110", "uvicorn>=0.27", "pydantic>=2"]

[project.optional-dependencies]
test = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
artemide-train = "artemide.training.train:main"
artemide-prepare = "artemide.training.prepare:main"
artemide-evaluate = "artemide.training.evaluate:main"
