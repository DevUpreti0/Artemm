name: Artemide Core v2.0

on:
  push:
    branches: [main]
    paths:
      - "core-v2.0/**"
      - ".github/workflows/artemide-core-v2.0.yml"
  pull_request:
    paths:
      - "core-v2.0/**"
      - ".github/workflows/artemide-core-v2.0.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install CPU PyTorch and API test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch
          python -m pip install -e "./core-v2.0[dev,api]"
      - name: Run v2.0 test suite
        run: python -m pytest core-v2.0/tests -q
