name: Artemide Core v2.2
on:
  push:
    branches: [main]
    paths: ["core-v2.2/**", ".github/workflows/artemide-core-v2.2.yml"]
  pull_request:
    paths: ["core-v2.2/**", ".github/workflows/artemide-core-v2.2.yml"]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - uses: actions/setup-node@v4
        with: {node-version: "20"}
      - name: Install CPU PyTorch and API test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch
          python -m pip install -e "./core-v2.2[dev,api]"
      - name: Run core and SDK tests
        run: python -m pytest core-v2.2/tests -q
      - name: Check JavaScript SDK syntax
        run: node --check core-v2.2/sdks/javascript/index.mjs
