name: Artemide Core v2.3
on:
  push:
    branches: [main]
    paths: ["core-v2.3/**", ".github/workflows/artemide-core-v2.3.yml"]
  pull_request:
    paths: ["core-v2.3/**", ".github/workflows/artemide-core-v2.3.yml"]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - name: Install CPU PyTorch and API test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch
          python -m pip install -e "./core-v2.3[dev,api]"
      - name: Run core and developer-key tests
        run: python -m pytest core-v2.3/tests -q
