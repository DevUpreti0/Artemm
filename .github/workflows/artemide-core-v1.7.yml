name: Artemide Core v1.7

on:
  push:
    branches: [main]
    paths:
      - "core-v1.7/**"
      - ".github/workflows/artemide-core-v1.7.yml"
  pull_request:
    paths:
      - "core-v1.7/**"
      - ".github/workflows/artemide-core-v1.7.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install CPU PyTorch and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch
          python -m pip install -e "./core-v1.7[dev]"
      - name: Run v1.7 test suite
        run: python -m pytest core-v1.7/tests -q
